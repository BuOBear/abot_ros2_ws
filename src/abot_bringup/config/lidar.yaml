# YDLIDAR X3 Pro candidate profile, based on the official Humble X3 template.
# Resolve /dev/ydlidar to the actual adapter before enabling this driver.
# Frequency, DTR motor control, scan coverage and mounting need bench checks.
ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_link
    ignore_array: ''
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity_bit: 0
    intensity: false
    sample_rate: 3
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    inverted: false
    auto_reconnect: true
    support_motor_dtr: true
    angle_max: 180.0
    angle_min: -180.0
    range_max: 8.0
    range_min: 0.1
    frequency: 6.0
    invalid_range_is_inf: false
    debug: false
